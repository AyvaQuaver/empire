<!doctype html>
<html><head><meta charset="utf-8"><title>frame</title>
<style>html,body{margin:0;padding:0;background:#f3f0ef}.frame{border:0;display:block}</style></head>
<body><script>
const q=new URLSearchParams(location.search);
const w=parseInt(q.get("w")||"375",10);
const h=parseInt(q.get("h")||String(Math.round(w*2.14)),10);
const u=q.get("u")||"/";
document.write('<iframe class="frame" src="'+u+'" style="width:'+w+'px;height:'+h+'px"></iframe>');
</script></body></html>
