<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF9ED" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <title>Empire</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Never a silent blank page: if the app bundle hasn't mounted within 12s
         (e.g. a stalled proxy/tunnel or lost connection) show a retryable error. -->
    <script>
      if (!window.__empireDisableAssetWatchdog) {
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount === 0 && !window.__empireMounted) {
            root.innerHTML =
              '<div style="font-family:system-ui,sans-serif;max-width:420px;margin:80px auto;text-align:center;padding:0 16px">' +
              '<h1 style="font-size:24px;color:#29143F">Reconnecting…</h1>' +
              '<p style="color:#29143F;opacity:.8">The app files did not finish loading (the connection may have stalled).</p>' +
              '<button onclick="location.reload()" style="min-height:52px;padding:12px 28px;border:0;border-radius:999px;background:#F0503B;color:#fff;font-weight:700;font-size:18px;cursor:pointer">Try again</button>' +
              "</div>";
            root.style.minHeight = "40vh";
          }
        }, 12000);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
