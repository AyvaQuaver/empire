# Empire reverse proxy (nginx)
#
# Places in front of the Express app two HTTP hostnames backed by local TLS.
# Copy to /etc/nginx/sites-available/empire.conf and symlink sites-enabled.
#
#   prod:    playempire.uk      -> proxy to 127.0.0.1:8891  (empire@production)
#   staging: staging.playempire.uk -> proxy to 127.0.0.1:8892 (empire@staging)
#
# TLS certificates are provided by either:
#   a) certbot --nginx (Let's Encrypt ACME HTTP-01) — needs public HTTP on 80
#   b) a Cloudflare Origin CA certificate (recommended when the zone proxies
#      through Cloudflare: valid origin cert, never expires publicly; set the
#      zone to SSL/TLS mode "Full (strict)"). Install cert+key under
#      /etc/ssl/empire/ with 0600 root ownership.
# Never use Flexible SSL or skip certificate verification between edge and origin.

# --- playempire.uk (production) --------------------------------------------
server {
    listen 80;
    server_name playempire.uk www.playempire.uk;

    # ACME HTTP-01 challenge (keep reachable even with redirects)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # Canonicalise www -> apex
        return 301 https://playempire.uk$request_uri;
    }
}

# Cloudflare-origin HTTP hop also redirects everything to HTTPS
server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name playempire.uk;

    # Or the Cloudflare Origin CA pair, e.g.:
    # ssl_certificate     /etc/ssl/empire/playempire-ecdsa.pem;
    # ssl_certificate_key /etc/ssl/empire/playempire-ecdsa.key;
    ssl_certificate     /etc/letsencrypt/live/playempire.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playempire.uk/privkey.pem;

    # TLS >=1.2 with modern (not exotic) ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;

    # Sensible limits for a small JSON API + static SPA
    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    proxy_read_timeout 60s;

    # Real client IP reaches Express as the single proxy hop (app sets
    # "trust proxy = 1"). Preserve Cloudflare's own client-IP header.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # HSTS handled with care: managed at TLS-layer expiry via the app
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Cloudflare caches must never capture private, session-bound responses.
    # The app answers no-store on everything private; mirror it at the edge by
    # leaving caching to Cloudflare defaults (no "Cache Everything" rules).
    location / {
        proxy_pass http://127.0.0.1:8891;
    }

    # Only versioned build assets may be cached by whoever sits in front.
    location /assets/ {
        proxy_pass http://127.0.0.1:8891;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    access_log /var/log/nginx/empire.access.log combined;
    error_log  /var/log/nginx/empire.error.log warn;
}

# --- staging.playempire.uk (staging, isolated service) ---------------------
server {
    listen 80;
    server_name staging.playempire.uk;
    location / {
        return 301 https://staging.playempire.uk$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.playempire.uk;

    ssl_certificate     /etc/letsencrypt/live/staging.playempire.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.playempire.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSLSTG:5m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    proxy_read_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        proxy_pass http://127.0.0.1:8892;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8892;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    access_log /var/log/nginx/empire-staging.access.log combined;
    error_log  /var/log/nginx/empire-staging.error.log warn;
}
